[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde_json = { workspace = true }
# `cargo xtask icon` renders the app icon's SVG (pure Rust; xtask only, the program never reads
# the SVG) and writes its PNGs. resvg 0.45 shares tiny-skia 0.11 with the rest of the tree; the
# icon needs no text or fonts, but it embeds ictMail's mark as a PNG, so raster-images stays on.
image = { workspace = true }
resvg = { version = "0.49", default-features = false, features = ["raster-images"] }
# `cargo xtask release-key`: the ed25519 release signature, with the same crates the program
# verifies it with (already in the tree through rustls), so the release build downloads no tool.
ring = { workspace = true }
mailcraft-charset = { workspace = true }
# `cargo xtask i18n` reads and writes the interface's catalogues with the program's own reader.
mailcraft-i18n = { workspace = true }
